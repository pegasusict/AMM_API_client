[project]
name = "amm-api-client"
version = "0.1.0"
description = "GraphQL + OAuth2 API client for the AMM Music Manager"
authors = [{ name = "Mattijs Snepvangers", email = "pegasus.ict@gmail.com" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.15",
    "gql>=3.5.3",
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "websockets>=15.0.1",
]

[project.scripts]
amm-client = "cli:main"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
